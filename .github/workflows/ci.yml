name: Verify Frame

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frame-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  portable:
    name: Check CI and release scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-pinned actionlint
        run: |
          python3 script/ci/install-tool.py actionlint
          echo "$PWD/.build/ci-tools/bin" >> "$GITHUB_PATH"
      - name: Validate workflows, shell syntax, and release dispatch boundaries
        run: |
          mkdir -p .build/ci-results
          script/ci/check-portable.sh 2>&1 | tee .build/ci-results/portable.log
      - name: Retain portable failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-failure-${{ github.run_attempt }}
          path: .build/ci-results/
          retention-days: 3
          if-no-files-found: ignore

  macos:
    name: Build and test Frame
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Confirm pinned Xcode and Swift
        run: |
          xcodebuild -version
          swift --version
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 26.2'
          swift --version | grep -F "Swift version $(cat .swift-version) "
      - name: Install checksum-pinned Swift tools
        run: |
          python3 script/ci/install-tool.py swiftformat
          python3 script/ci/install-tool.py swiftlint
          echo "$PWD/.build/ci-tools/bin" >> "$GITHUB_PATH"
      - name: Check formatting and static rules
        run: |
          mkdir -p .build/ci-results
          script/dev/format.sh --verify 2>&1 | tee .build/ci-results/format.log
      - name: Resolve committed dependencies and run mock-backed tests
        id: tests
        run: |
          mkdir -p .build/ci-results
          swift package resolve --force-resolved-versions
          git diff --exit-code -- Package.resolved
          swift test --no-parallel --force-resolved-versions \
            2>&1 | tee .build/ci-results/swift-tests.log
      - name: Require executed tests in every test target
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: python3 script/ci/verify-test-results.py .build/ci-results/swift-tests.log
      - name: Retain test reports and failure diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-test-results-${{ github.run_attempt }}
          path: .build/ci-results/
          retention-days: 3
          if-no-files-found: warn

  required-checks:
    name: Overall CI result
    needs: [portable, macos, package]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Require every verification job to pass
        env:
          PORTABLE_RESULT: ${{ needs.portable.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "$PORTABLE_RESULT" = success
          test "$MACOS_RESULT" = success
          test "$PACKAGE_RESULT" = success

  package:
    name: Build and verify release package
    needs: [portable, macos]
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      FRAME_BUILD_LOG_DIR: .build/ci-results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build without distribution credentials
        run: |
          mkdir -p .build/ci-results
          xcodebuild -version
          script/release/build-release.sh --build-version 0.0.0 --codesign-identity - \
            2>&1 | tee .build/ci-results/package-build.log
      - name: Validate the archive and metadata without starting the daemon
        run: script/ci/verify-package.sh
      - name: Retain package failure diagnostics, never distributable binaries
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-failure-${{ github.run_attempt }}
          path: .build/ci-results/
          retention-days: 3
          if-no-files-found: warn
